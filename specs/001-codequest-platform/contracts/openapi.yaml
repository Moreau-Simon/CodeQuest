          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoreChapter' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /channels:
    get:
      tags: [Chat]
      summary: Canaux accessibles au compte
      responses:
        '200':
          description: Canaux de l'audience du compte
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatChannel' }
        '401': { $ref: '#/components/responses/Error' }

  /channels/{channelId}/messages:
    get:
      tags: [Chat]
      summary: Historique d'un canal
      parameters:
        - { name: channelId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ChatMessage' }
                  nextCursor: { type: string, nullable: true }
        '403': { $ref: '#/components/responses/Error' }

  /channels/{channelId}/messages/{messageId}/reports:
    post:
      tags: [Chat]
      summary: Signaler un message
      parameters:
        - { name: channelId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '201':
          description: Signalement enregistré
          content:
            application/json:
              schema:
                type: object
                properties:
                  reported: { type: boolean, enum: [true] }
        '403': { $ref: '#/components/responses/Error' }

  /admin/chat/messages/{messageId}/sanctions:
    post:
      tags: [Admin]
      summary: Supprimer un message et sanctionner son auteur
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, reason]
              properties:
                kind: { type: string, enum: [mute, ban] }
                reason: { type: string, minLength: 1, maxLength: 500 }
                durationMinutes: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Sanction appliquée et journalisée
          content:
            application/json:
              schema:
                type: object
                properties:
                  messageId: { type: string, format: uuid }
                  endsAt: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Error' }

  /admin/users:
    get:
      tags: [Admin]
      summary: Lister et administrer les utilisateurs
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: Utilisateurs }
        '403': { description: Permission `user:write` requise }

  /admin/challenges:
    post:
      tags: [Admin]
      summary: Créer un défi en brouillon
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChallengeDraft' }
      responses:
        '201': { description: Défi créé en brouillon }

  /admin/challenges/{challengeId}/validate:
    post:
      tags: [Admin]
      summary: Valider un défi (solution de référence, tests, calibrage)
      parameters:
        - { name: challengeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Validation réussie, bornes calibrées }
        '422': { description: Validation échouée, test fautif identifié }

  /admin/events:
    post:
      tags: [Admin]
      summary: Créer un événement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventDraft' }
      responses:
        '201': { description: Événement créé en brouillon }

  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: Consulter le journal d'audit
      parameters:
        - { name: actorId, in: query, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: Entrées d'audit }

  /notifications/vapid-public-key:
    get:
      tags: [Notifications]
      summary: Clé publique VAPID pour l'abonnement Web Push
      security: []
      responses:
        '200':
          description: Clé publique (chaîne vide si Web Push n'est pas configuré)
          content:
            application/json:
              schema:
                type: object
                required: [publicKey]
                properties:
                  publicKey: { type: string }

  /notifications/subscriptions:
    post:
      tags: [Notifications]
      summary: Enregistrer un abonnement Web Push après autorisation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, format: uri }
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: { type: string }
                    auth: { type: string }
      responses:
        '201':
          description: Abonnement enregistré
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  endpoint: { type: string }
                  createdAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Notifications]
      summary: Révoquer un abonnement Web Push
      parameters:
        - { name: endpoint, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Abonnement révoqué
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: boolean, enum: [true] }
        '401': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  responses:
    Error:
      description: Erreur normalisée
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Consent:
      type: object
      required: [purpose, granted, recordedAt]
      properties:
        purpose: { type: string, enum: [analytics, notifications, research] }
        granted: { type: boolean }
        source: { type: string, nullable: true }
        recordedAt: { type: string, format: date-time }

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: CHALLENGE_LOCKED }
        message: { type: string }
        details: { type: object, additionalProperties: true }

    AssetSubject:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [player, team] }
        id: { type: string }

    AssetQrStyle:
      type: object
      properties:
        fragments: { type: integer, minimum: 1, maximum: 9 }
        rotationDeg: { type: integer, minimum: -180, maximum: 180 }
        noiseLevel: { type: number, minimum: 0, maximum: 1 }
        overlay: { type: boolean }

    AssetGenerateRequest:
      type: object
      required: [challengeId, challengeVersion, kind, subject]
      properties:
        challengeId: { type: string }
        challengeVersion: { type: integer }
        kind: { type: string, enum: [steganography, qr_code] }
        subject: { $ref: '#/components/schemas/AssetSubject' }
        payload: { type: string, maxLength: 2048 }
        qrStyle: { $ref: '#/components/schemas/AssetQrStyle' }

    AssetVerifyRequest:
      allOf:
        - $ref: '#/components/schemas/AssetGenerateRequest'
        - type: object
          required: [answer]
          properties:
            answer:
              type: object
              properties:
                text: { type: string }
                assetId: { type: string }

    AssetView:
      type: object
      required: [assetId, seedFingerprint, objectKey, url, sha256, width, height, bytes, generatedAt, cached]
      properties:
        assetId: { type: string }
        seedFingerprint: { type: string }
        objectKey: { type: string }
        url: { type: string, format: uri-reference }
        sha256: { type: string }
        width: { type: integer, minimum: 600, maximum: 2000 }
        height: { type: integer, minimum: 600, maximum: 2000 }
        bytes: { type: integer, minimum: 0 }
        generatedAt: { type: string, format: date-time }
        cached: { type: boolean }

    AssetVerification:
      type: object
      required: [correct, partial, reason, elapsedMs]
      properties:
        correct: { type: boolean }
        partial:
          type: object
          required: [matchedFragments, totalFragments]
          properties:
            matchedFragments: { type: integer, minimum: 0 }
            totalFragments: { type: integer, minimum: 1 }
        reason: { type: string, nullable: true, enum: [payload_mismatch, incomplete_fragments, null] }
        elapsedMs: { type: integer, minimum: 0 }

    TeamMember:
      type: object
      required: [userId, pseudonym, role, joinedAt]
      properties:
        userId: { type: string, format: uuid }
        pseudonym: { type: string }
        role: { type: string, enum: [captain, member] }
        joinedAt: { type: string, format: date-time }

    Team:
      type: object
      required: [id, name, tag, captainId, members, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 3, maxLength: 40 }
        tag: { type: string, minLength: 2, maxLength: 6 }
        description: { type: string, nullable: true }
        logoKey: { type: string, nullable: true }
        captainId: { type: string, format: uuid, nullable: true }
        members:
          type: array
          items: { $ref: '#/components/schemas/TeamMember' }
        createdAt: { type: string, format: date-time }
        disbandedAt: { type: string, format: date-time, nullable: true }

    TeamInvitation:
      type: object
      required: [token, inviteUrl, teamId, expiresAt]
      properties:
        token: { type: string }
        inviteUrl:
          type: string
          format: uri
          description: Lien d'adhésion `/teams/join` portant `teamId` et `token`.
        teamId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }

    TeamOfficialSubmission:
      type: object
      required: [id, teamId, challengeId, submissionId, score, designatedAt]
      properties:
        id: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        challengeId: { type: string, format: uuid }
        submissionId: { type: string, format: uuid }
        score: { type: number }
        designatedBy: { type: string, format: uuid, nullable: true }
        designatedAt: { type: string, format: date-time }

    ContributionScore:
      type: object
      required: [teamId, userId, keptLines, successes, assistance, coefficient, score]
      properties:
        teamId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        keptLines: { type: integer }
        successes: { type: integer }
        assistance: { type: integer }
        coefficient: { type: number }
        score: { type: integer }

    Profile:
      type: object
      properties:
        id: { type: string, format: uuid }
        pseudonym: { type: string }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        level: { type: integer }
        xp: { type: integer }
        avatarUrl: { type: string, nullable: true }
        preferredLanguage: { type: string, enum: [python, javascript] }
        preferences: { type: object, additionalProperties: true }
        badges:
          type: array
          items: { type: string }

    ProfilePatch:
      type: object
      properties:
        pseudonym: { type: string, minLength: 3, maxLength: 20 }
        preferredLanguage: { type: string, enum: [python, javascript] }
        preferences: { type: object, additionalProperties: true }
        avatarKey: { type: string }

    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        userAgent: { type: string }
        ipPrefix: { type: string }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        current: { type: boolean }

    PlayerHealth:
      type: object
      required: [hp, maxHp, koUntil, nextRegenAt, serverNow]
      properties:
        hp: { type: integer, minimum: 0, maximum: 100 }
        maxHp: { type: integer, example: 100 }
        koUntil: { type: string, format: date-time, nullable: true }
        nextRegenAt: { type: string, format: date-time, nullable: true }
        serverNow: { type: string, format: date-time }

    Wallet:
      type: object
      properties:
        balance: { type: integer, minimum: 0 }
        recentTransactions:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              amount: { type: integer }
              reason: { type: string }
              balanceAfter: { type: integer }
              createdAt: { type: string, format: date-time }

    PurchaseResult:
      type: object
      required: [itemId, sku, priceBits, balance, quantity]
      properties:
        itemId: { type: string, format: uuid }
        sku: { type: string }
        priceBits: { type: integer, minimum: 0 }
        balance: { type: integer, minimum: 0 }
        quantity: { type: integer, minimum: 0 }

    ChallengeType:
      type: string
      enum: [sorting, debugging, decryption, steganography, qr_code]

    ChallengeSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        theme: { type: string }
        type: { $ref: '#/components/schemas/ChallengeType' }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        status: { type: string, enum: [locked, available, completed] }
        bestScore: { type: number, nullable: true }

    ChallengeDetail:
      allOf:
        - $ref: '#/components/schemas/ChallengeSummary'
        - type: object
          properties:
            statement: { type: string }
            languages: { type: array, items: { type: string } }
            basePoints: { type: integer }
            perfMax: { type: integer }
            currentVersion: { type: integer }
            buggyCode:
              type: string
              nullable: true
              description: Code bogué du défi de débogage, sans indication du bug ni correction
            maxModifiedLines:
              type: integer
              nullable: true
              description: Limite de lignes modifiées conservant le bonus temps (FR-038)
            cipher: { type: string, nullable: true }
            instance:
              type: object
              nullable: true
              description: Instance de décryptage générée pour ce joueur, sans graine ni réponse attendue
            hints:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  order: { type: integer }
                  priceBits: { type: integer }
                  purchased: { type: boolean }
                  content:
                    type: string
                    description: Présent uniquement après achat, jamais avant (FR-042)
            missingPrerequisites:
              type: array
              items: { type: string }

    Submission:
      type: object
      properties:
        id: { type: string, format: uuid }
        challengeId: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, running, passed, failed, error, timeout, rejected]
        score: { type: number, nullable: true }
        testsPassed: { type: integer, nullable: true }
        testsTotal: { type: integer, nullable: true }
        cpuTimeMedianMs: { type: integer, nullable: true }
        verdictReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        attemptId: { type: string, format: uuid, nullable: true }
        modifiedLines: { type: integer, nullable: true }
        hintsUsed: { type: integer }
        teamId: { type: string, format: uuid, nullable: true }
        isOfficial: { type: boolean }

    ChallengeAttempt:
      type: object
      properties:
        id: { type: string, format: uuid }
        challengeId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        expiredAt: { type: string, format: date-time }
        verdictAt: { type: string, format: date-time, nullable: true }

    LeaderboardEntry:
      type: object
      properties:
        rank: { type: integer }
        subjectId: { type: string, format: uuid }
        displayName: { type: string }
        score: { type: number }
        achievedAt: { type: string, format: date-time }

    Lesson:
      type: object
      required: [id, title, theme, order, status, positioningTestAvailable]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        theme: { type: string }
        order: { type: integer }
        estimatedMinutes: { type: integer }
        status: { type: string, enum: [not_started, in_progress, completed] }
        positioningTestAvailable: { type: boolean }
        contentMd: { type: string }
        quiz: { $ref: '#/components/schemas/Quiz' }
        applicationChallenge:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
        progress: { $ref: '#/components/schemas/LessonProgress' }

    QuizQuestion:
      type: object
      required: [id, prompt, choices]
      properties:
        id: { type: string }
        prompt: { type: string }
        choices:
          type: array
          items: { type: string }

    Quiz:
      type: object
      required: [passScore, questions]
      properties:
        passScore: { type: integer, minimum: 0, maximum: 100 }
        questions:
          type: array
          items: { $ref: '#/components/schemas/QuizQuestion' }

    QuizAnswers:
      type: object
      additionalProperties: { type: integer, minimum: 0 }
      description: Réponses indexées par identifiant de question

    QuizResult:
      type: object
      required: [score, correct, total, passed]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        correct: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        passed: { type: boolean }

    PositioningResult:
      type: object
      required: [score, passed, exempted, source]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        passed: { type: boolean }
        exempted: { type: boolean }
        source: { type: string, enum: [positioning, null], nullable: true }

    LessonProgress:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [not_started, in_progress, completed] }
        quizScore: { type: integer, minimum: 0, maximum: 100, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }

    LessonCompletion:
      type: object
      required: [lessonId, status, quizScore, completedAt, xp, level]
      properties:
        lessonId: { type: string, format: uuid }
        status: { type: string, enum: [not_started, in_progress, completed] }
        quizScore: { type: integer, minimum: 0, maximum: 100 }
        completedAt: { type: string, format: date-time }
        xp: { type: integer, minimum: 0 }
        level: { type: integer, minimum: 1 }
        applicationChallenge:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            title: { type: string }

    FirstAttemptStats:
      type: object
      required: [attempts, successes, rate]
      properties:
        attempts: { type: integer, minimum: 0 }
        successes: { type: integer, minimum: 0 }
        rate: { type: number, minimum: 0, maximum: 1 }

    Event:
      type: object
      required: [id, title, timezone, startsAt, endsAt, status, type, maxAttempts, challengeIds, joined, attemptConsumed, serverNow]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        timezone: { type: string, example: Europe/Paris }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { type: string, enum: [draft, scheduled, open, finished, archived] }
        type: { type: string, enum: [standard, battle_royale] }
        maxAttempts: { type: integer, enum: [1], description: "v1 : un seul essai par participant (FR-065)" }
        challengeIds:
          type: array
          items: { type: string, format: uuid }
        joined: { type: boolean }
        attemptConsumed: { type: boolean }
        serverNow:
          type: string
          format: date-time
          description: Horloge serveur UTC, référence des comptes à rebours (FR-061)

    BattleRound:
      type: object
      required: [id, eventId, roundNumber, challengeId, startsAt, endsAt, status, results]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        roundNumber: { type: integer, minimum: 1 }
        challengeId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, open, closed] }
        results:
          type: array
          items: { $ref: '#/components/schemas/BattleRoundResult' }

    BattleRoundResult:
      type: object
      required: [subjectId, score, eliminated]
      properties:
        subjectId: { type: string, format: uuid }
        score: { type: number }
        eliminated: { type: boolean }

    EventParticipation:
      type: object
      required: [eventId, joined]
      properties:
        eventId: { type: string, format: uuid }
        joined: { type: boolean }

    EventAttempt:
      type: object
      required: [eventId, attemptStartedAt, attemptConsumedAt]
      properties:
        eventId: { type: string, format: uuid }
        attemptStartedAt: { type: string, format: date-time }
        attemptConsumedAt: { type: string, format: date-time }

    EventResults:
      type: object
      required: [eventId, status, published, leaderboard, rewards, solutions]
      properties:
        eventId: { type: string, format: uuid }
        status: { type: string, enum: [finished, archived] }
        published: { type: boolean }
        publishedAt: { type: string, format: date-time, nullable: true }
        rewards: { type: object, additionalProperties: true, nullable: true }
        leaderboard:
          type: object
          required: [items, nextCursor]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/LeaderboardEntry' }
            nextCursor: { type: string, nullable: true }
        solutions:
          type: array
          items:
            type: object
            required: [challengeId, unlocked]
            properties:
              challengeId: { type: string, format: uuid }
              unlocked: { type: boolean }

    EventSolution:
      type: object
      required: [eventId, challengeId, solution]
      properties:
        eventId: { type: string, format: uuid }
        challengeId: { type: string, format: uuid }
        solution: { type: string }

    Boss:
      type: object
      required: [id, name, maxHp, chapter, phases, hpRemaining, defeated]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        maxHp: { type: integer }
        chapter: { type: string }
        phases:
          type: array
          items:
            type: object
            required: [id, order, completed]
            properties:
              id: { type: string, format: uuid }
              order: { type: integer }
              completed: { type: boolean }
        hpRemaining: { type: integer, nullable: true }
        defeated: { type: boolean }

    BossPhaseSubmission:
      type: object
      required: [submissionId, bossPhaseId, status]
      properties:
        submissionId: { type: string, format: uuid }
        bossPhaseId: { type: string, format: uuid }
        status: { type: string, enum: [pending, running, passed, failed, error, timeout, rejected] }

    ShopItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [hint, potion, avatar, title, editor_theme, early_access]
        priceBits: { type: integer, minimum: 0 }
        available: { type: boolean }
        metadata:
          type: object
          description: 'Ex. {"hintId": "..."} ou {"hp_restore": 50}'

    LoreChapter:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        requiredLevel: { type: integer }
        order: { type: integer }
        audioKey: { type: string, nullable: true }
        unlocked: { type: boolean }
        read: { type: boolean }
        readAt: { type: string, format: date-time, nullable: true }
        content:
          type: string
          description: Markdown du chapitre, absent tant que le chapitre est verrouillé

    ChatChannel:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [global, team, event, spectator] }
        canWrite: { type: boolean }

    ChatMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        channelId: { type: string, format: uuid }
        authorName: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        deleted: { type: boolean }

    ChallengeDraft:
      type: object
      required: [themeId, type, difficulty, title, statement, languages, basePoints]
      properties:
        themeId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ChallengeType' }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string, maxLength: 120 }
        statement: { type: string }
        languages: { type: array, items: { type: string, enum: [python, javascript] } }
        basePoints: { type: integer, minimum: 0 }
        perfMax: { type: integer, minimum: 0 }
        prerequisites:
          type: array
          items:
            type: object
            properties:
              requiredChallengeId: { type: string, format: uuid }
              requiredLevel: { type: integer }
              requiredLessonId: { type: string, format: uuid }
              requiredLoreChapterId: { type: string, format: uuid }

    EventDraft:
      type: object
      required: [title, timezone, startsAt, endsAt, type]
      properties:
        title: { type: string }
        timezone: { type: string, example: Europe/Paris }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        type: { type: string, enum: [standard, battle_royale] }
        challengeIds:
          type: array
          items: { type: string, format: uuid }
        minParticipants: { type: integer, minimum: 2, default: 8 }
        rewards: { type: object, additionalProperties: true }

security:
  - cookieAuth: []
