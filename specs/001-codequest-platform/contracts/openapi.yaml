openapi: 3.0.3
info:
  title: CodeQuest API
  version: 1.0.0
  description: |
    API REST JSON versionnée de la plateforme CodeQuest.

    - Authentification par cookies `HttpOnly` : `access_token` (JWT 15 min) et
      `refresh_token` (opaque, rotation à chaque usage).
    - Toutes les erreurs partagent le format `{ code, message, details }`.
    - Pagination par curseur (`cursor`, `limit`), `limit` par défaut 20, maximum 100.
    - Les opérations d'achat acceptent l'en-tête `Idempotency-Key`.
    - Les permissions sont vérifiées côté serveur, refus par défaut.

    Spécification source : `specs/001-codequest-platform/spec.md`.
servers:
  - url: /api/v1
    description: Instance courante
tags:
  - name: Auth
  - name: Me
  - name: Challenges
  - name: Leaderboards
  - name: Lessons
  - name: Teams
  - name: Events
  - name: Bosses
  - name: Economy
  - name: Lore
  - name: Chat
  - name: Notifications
  - name: Privacy
  - name: Admin

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Créer un compte
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, pseudonym, password]
              properties:
                email: { type: string, format: email }
                pseudonym: { type: string, minLength: 3, maxLength: 20, pattern: '^[a-zA-Z0-9_-]+$' }
                password: { type: string, minLength: 12 }
      responses:
        '201': { description: Compte créé, e-mail de confirmation envoyé }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Se connecter (e-mail ou pseudo)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Sessions ouvertes ; cookies posés
          headers:
            Set-Cookie:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '423': { description: Compte temporairement bloqué (5 échecs) }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Révoquer la session courante ou toutes les sessions
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                all: { type: boolean, default: false }
      responses:
        '204': { description: Session(s) révoquée(s) }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotation du refresh token
      security: []
      responses:
        '204': { description: Nouveaux cookies émis }
        '401': { description: Jeton invalide, réutilisé ou expiré }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Demander un lien de réinitialisation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier: { type: string }
      responses:
        '202': { description: Réponse identique que le compte existe ou non }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Consommer un jeton de réinitialisation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 12 }
      responses:
        '204': { description: Mot de passe changé, sessions révoquées }
        '400': { $ref: '#/components/responses/Error' }

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Confirmer une adresse e-mail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204': { description: Adresse confirmée, compte activé }

  /me:
    get:
      tags: [Me]
      summary: Profil courant
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
    patch:
      tags: [Me]
      summary: Mettre à jour le profil et les préférences
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfilePatch' }
      responses:
        '200': { description: Profil mis à jour }
    delete:
      tags: [Me]
      summary: Supprimer logiquement son compte
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '202': { description: Suppression logique, purge à J+30 }

  /me/export:
    get:
      tags: [Me]
      summary: Exporter ses données personnelles (RGPD)
      responses:
        '200':
          description: Archive des données
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /privacy/consents:
    get:
      tags: [Privacy]
      summary: Lister les consentements enregistrés
      responses:
        '200':
          description: Registre des consentements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Consent' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [Privacy]
      summary: Enregistrer ou modifier un consentement explicite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, granted]
              properties:
                purpose: { type: string, enum: [analytics, notifications, research] }
                granted: { type: boolean }
                source: { type: string, maxLength: 64 }
      responses:
        '201': { description: Consentement enregistré }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /privacy/export:
    get:
      tags: [Privacy]
      summary: Exporter les données personnelles (sans secret ni jeton)
      responses:
        '200':
          description: Export RGPD
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Error' }

  /privacy/me:
    patch:
      tags: [Privacy]
      summary: Rectifier les données personnelles du profil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pseudonym: { type: string, maxLength: 40 }
                email: { type: string, format: email }
      responses:
        '204': { description: Profil rectifié }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /me/sessions:
    get:
      tags: [Me]
      summary: Lister les sessions actives
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Session' }
    delete:
      tags: [Me]
      summary: Révoquer toutes les sessions
      responses:
        '204': { description: Toutes les sessions révoquées }

  /me/sessions/{sessionId}:
    delete:
      tags: [Me]
      summary: Révoquer une session
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Session révoquée }

  /me/health:
    get:
      tags: [Bosses]
      summary: Points de vie et état de KO
      responses:
        '200':
          description: État de santé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayerHealth' }

  /me/wallet:
    get:
      tags: [Economy]
      summary: Solde et dernières transactions
      responses:
        '200':
          description: Portefeuille
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }

  /me/badges:
    get:
      tags: [Economy]
      summary: Clés des badges attribués (FR-077)
      responses:
        '200':
          description: Badges du joueur
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys: { type: array, items: { type: string } }

  /me/inventory/{itemId}/equip:
    post:
      tags: [Economy]
      summary: Équiper un objet cosmétique (sans effet sur le score)
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Objet équipé
          content:
            application/json:
              schema:
                type: object
                required: [itemId, equipped]
                properties:
                  itemId: { type: string, format: uuid }
                  equipped: { type: boolean }
        '404': { $ref: '#/components/responses/Error' }

  /challenges:
    get:
      tags: [Challenges]
      summary: Catalogue filtré
      parameters:
        - { name: theme, in: query, schema: { type: string } }
        - { name: difficulty, in: query, schema: { type: integer, minimum: 1, maximum: 5 } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ChallengeType' } }
        - { name: status, in: query, schema: { type: string, enum: [locked, available, completed] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ChallengeSummary' }
                  nextCursor: { type: string, nullable: true }

  /challenges/{challengeId}:
    get:
      tags: [Challenges]
      summary: Détail d'un défi et de ses prérequis
      parameters:
        - { name: challengeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Défi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChallengeDetail' }
        '403': { description: Prérequis non satisfaits, motif détaillé }

  /challenges/{challengeId}/attempts:
    post:
      tags: [Challenges]
      summary: Démarrer explicitement l'unique essai d'un défi chronométré (A5)
      parameters:
        - { name: challengeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201':
          description: Essai démarré ; le chrono part de startedAt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChallengeAttempt' }
        '403': { description: Compte non confirmé ou prérequis non satisfaits }
        '409': { description: Une seule tentative autorisée (ATTEMPT_ALREADY_STARTED) }

  /assets/generate:
    post:
      tags: [Assets]
      operationId: generateAsset
      summary: Génère une instance d'asset (stéganographie ou QR code)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetGenerateRequest'
      responses:
        '201':
          description: Instance générée ou retrouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetView'
        '400':
          description: Paramètres invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentification requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflit de clé d'objet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Payload impossible à encoder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service d'assets indisponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assets/verify:
    post:
      tags: [Assets]
      operationId: verifyAsset
      summary: Vérifie une réponse sans jamais révéler l'attendu
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetVerifyRequest'
      responses:
        '200':
          description: Résultat de vérification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetVerification'
        '400':
          description: Paramètres invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentification requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Trop de vérifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service d'assets indisponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /assets/{assetId}/content:
    get:
      tags: [Assets]
      operationId: getAssetContent
      summary: Redirige vers l'URL signée de l'asset (15 minutes)
      security:
        - cookieAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirection vers l'URL signée
          headers:
            Location:
              schema:
                type: string
                format: uri
        '401':
          description: Authentification requise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Asset inconnu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /challenges/{challengeId}/submissions:
    post:
      tags: [Challenges]
      summary: Soumettre une solution
      parameters:
        - { name: challengeId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language, code]
              properties:
                language: { type: string, enum: [python, javascript] }
                code: { type: string, maxLength: 131072 }
                attemptId:
                  type: string
                  format: uuid
                  description: Essai démarré explicitement, obligatoire en débogage/décryptage (A5)
                teamId:
                  type: string
                  format: uuid
                  description: Équipe au titre de laquelle la soumission contribue (FR-060, membre actif requis)
                eventId:
                  type: string
                  format: uuid
                  description: Événement à essai unique au titre duquel la soumission est faite (FR-062)
      responses:
        '400': { description: Essai requis (ATTEMPT_REQUIRED) }
        '202':
          description: Soumission acceptée, verdict diffusé en temps réel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
        '409': { description: Essai déjà consommé (event) ou event fermé }

  /submissions/{submissionId}:
    get:
      tags: [Challenges]
      summary: État et verdict d'une soumission (repli du temps réel)
      parameters:
        - { name: submissionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Soumission
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }

  /leaderboards/players:
    get:
      tags: [Leaderboards]
      summary: Classement des joueurs
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [global, theme, season, event, team] } }
        - { name: scopeId, in: query, schema: { type: string, format: uuid } }
        - { name: period, in: query, schema: { type: string, enum: [week, month, season, all] } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Entrées classées
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LeaderboardEntry' }
                  nextCursor: { type: string, nullable: true }

  /leaderboards/teams:
    get:
      tags: [Leaderboards]
      summary: Classement des équipes
      parameters:
        - { name: period, in: query, schema: { type: string, enum: [week, month, season, all] } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Entrées classées
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LeaderboardEntry' }

  /leaderboards/events/{eventId}:
    get:
      tags: [Leaderboards]
      summary: Classement d'un événement
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Classement dédié
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LeaderboardEntry' }

  /lessons:
    get:
      tags: [Lessons]
      summary: Lister les cours et leur progression
      parameters:
        - { name: theme, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Cours
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Lesson' }

  /lessons/{lessonId}:
    get:
      tags: [Lessons]
      summary: Lire le contenu d'une leçon et son mini-quiz (sans les réponses)
      parameters:
        - { name: lessonId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Leçon
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lesson' }
        '404': { $ref: '#/components/responses/Error' }

  /lessons/metrics/first-attempt:
    get:
      tags: [Lessons]
      summary: Taux de réussite au premier essai après une leçon (SC-010)
      parameters:
        - { name: lessonId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Statistiques agrégées
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirstAttemptStats' }

  /lessons/{lessonId}/start:
    post:
      tags: [Lessons]
      summary: Marquer le début de lecture d'une leçon
      parameters:
        - { name: lessonId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Progression
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonProgress' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /lessons/{lessonId}/quiz:
    post:
      tags: [Lessons]
      summary: Noter le mini-quiz d'une leçon sans la valider
      parameters:
        - { name: lessonId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuizAnswers' }
      responses:
        '200':
          description: Résultat du quiz
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuizResult' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /lessons/{lessonId}/positioning:
    post:
      tags: [Lessons]
      summary: Passer le test de positionnement et obtenir une dispense
      parameters:
        - { name: lessonId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuizAnswers' }
      responses:
        '200':
          description: Résultat du positionnement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PositioningResult' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /lessons/{lessonId}/complete:
    post:
      tags: [Lessons]
      summary: Marquer un cours terminé après réussite du quiz
      parameters:
        - { name: lessonId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quizScore]
              properties:
                quizScore: { type: integer, minimum: 0, maximum: 100 }
                answers: { $ref: '#/components/schemas/QuizAnswers' }
      responses:
        '200':
          description: Progression enregistrée et XP éventuelle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LessonCompletion' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /teams:
    post:
      tags: [Teams]
      summary: Créer une équipe (le créateur en devient capitaine)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, tag]
              properties:
                name: { type: string, minLength: 3, maxLength: 40 }
                tag: { type: string, minLength: 2, maxLength: 6 }
                description: { type: string, maxLength: 500 }
                logo: { type: string }
      responses:
        '201':
          description: Équipe créée, créateur capitaine
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /teams/{teamId}:
    get:
      tags: [Teams]
      summary: Détail d'une équipe et de ses membres actifs
      parameters:
        - { name: teamId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Équipe et membres
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '404': { $ref: '#/components/responses/Error' }

  /teams/{teamId}/invitations:
    post:
      tags: [Teams]
      summary: Inviter un membre par pseudo, ou créer un lien nu
      parameters:
        - { name: teamId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pseudonym: { type: string, minLength: 3, maxLength: 20 }
      responses:
        '201':
          description: Invitation créée (jeton renvoyé une seule fois)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamInvitation' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /teams/{teamId}/members:
    post:
      tags: [Teams]
      summary: Accepter une invitation / rejoindre l'équipe
      parameters:
        - { name: teamId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '201':
          description: Membre ajouté
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /teams/{teamId}/members/{userId}:
    delete:
      tags: [Teams]
