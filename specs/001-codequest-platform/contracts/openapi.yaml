        n'est joint que pour un compte connecté au niveau requis.
      responses:
        '200':
          description: Chapitres
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LoreChapter' }

  /lore/chapters/{chapterId}/read:
    post:
      tags: [Lore]
