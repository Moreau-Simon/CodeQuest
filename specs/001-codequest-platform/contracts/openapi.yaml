        '400': { $ref: '#/components/responses/Error' }
        '402': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /lore/chapters:
    get:
      tags: [Lore]
      summary: Chapitres de lore débloqués et état de lecture (lecture publique FR-003)
      security: []
      description: >
