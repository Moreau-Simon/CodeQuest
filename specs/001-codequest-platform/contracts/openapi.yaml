      responses:
        '204': { description: Membre retiré, scores acquis conservés }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /teams/{teamId}/captain:
    patch:
      tags: [Teams]
      summary: Transférer la capitainerie à un membre actif
      parameters:
        - { name: teamId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
