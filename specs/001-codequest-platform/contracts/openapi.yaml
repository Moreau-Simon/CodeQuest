        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /events/{eventId}/challenges/{challengeId}/solution:
    get:
      tags: [Events]
      summary: Corrigé d'un défi d'événement, disponible après clôture
      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: challengeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Solution de référence déchiffrée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventSolution' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /bosses:
    get:
