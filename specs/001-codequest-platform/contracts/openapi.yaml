      parameters:
        - { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201':
          description: Inscription enregistrée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventParticipation' }
        '409': { $ref: '#/components/responses/Error' }

  /events/{eventId}/start:
    post:
