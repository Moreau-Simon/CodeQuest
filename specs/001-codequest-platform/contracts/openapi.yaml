        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /teams/{teamId}/official-submission/{challengeId}:
    delete:
      tags: [Teams]
      summary: Révoquer la désignation officielle (capitaine)
      parameters:
        - { name: teamId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: challengeId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Désignation révoquée, classement d'équipe recalculé }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /teams/{teamId}/contributions:
    get:
      tags: [Teams]
      summary: Classement des contributions individuelles d'une équipe (FR-059)
      parameters:
        - { name: teamId, in: path, required: true, schema: { type: string, format: uuid } }
