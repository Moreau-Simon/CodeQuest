      summary: Lister les boss et leur état
      responses:
        '200':
          description: Boss
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Boss' }

  /bosses/{bossId}/phases/{phaseId}/submissions:
    post:
      tags: [Bosses]
      summary: Soumettre une phase de boss
