          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContributionScore' }
        '404': { $ref: '#/components/responses/Error' }

  /events:
    get:
      tags: [Events]
      summary: Lister les événements visibles
      responses:
        '200':
          description: Événements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }

  /events/{eventId}/join:
    post:
      tags: [Events]
