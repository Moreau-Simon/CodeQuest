global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3000']

  - job_name: runner
    static_configs:
      - targets: ['runner:9464']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: backup-verify
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
