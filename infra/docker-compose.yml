name: codequest

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codequest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codequest}
      POSTGRES_DB: ${POSTGRES_DB:-codequest}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-codequest} -d ${POSTGRES_DB:-codequest}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-codequest}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-codequest123}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - '1025:1025'
      - '8025:8025'
    networks: [backend]

  livekit:
    image: livekit/livekit-server:v1.7.2
    command: ['--dev', '--bind', '0.0.0.0']
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret}'
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'
    networks: [backend]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../.env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-codequest}:${POSTGRES_PASSWORD:-codequest}@postgres:5432/${POSTGRES_DB:-codequest}?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      ASSETS_SEED_KEY: ${ASSETS_SEED_KEY:-codequest-dev-seed-key-000000000000}
      ASSETS_SERVICE_URL: http://assets:8000
      SMTP_HOST: mailhog
      LIVEKIT_URL: ws://livekit:7880
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [backend, frontend]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:8080'
    depends_on:
      - api
    networks: [frontend]

  runner:
    build:
      context: ..
      dockerfile: services/runner/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      REDIS_URL: redis://redis:6379
      QUEUE_SUBMISSIONS: ${QUEUE_SUBMISSIONS:-submissions}
      RUNNER_ID: runner-1
    depends_on:
      redis:
        condition: service_healthy
    # L'isolation réelle (gVisor, cgroups, seccomp) est ajoutée par T081-T082.
    networks: [backend]

  assets:
    build:
      context: ../services/assets
      dockerfile: Dockerfile
    environment:
      ASSETS_SEED_KEY: ${ASSETS_SEED_KEY:-codequest-dev-seed-key-000000000000}
      ASSETS_S3_ENDPOINT: http://minio:9000
      ASSETS_S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:-codequest}
    ports:
      - '8001:8000'
    depends_on:
      minio:
        condition: service_healthy
    networks: [backend]

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
