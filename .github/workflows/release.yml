name: Release SemVer

# T272 — ne taguer `main` qu'après une CI complètement verte.
# `main` étant protégée (PR + revue), le CHANGELOG est proposé via une PR dédiée :
# le workflow ne pousse jamais directement sur la branche protégée.
on:
  workflow_run:
    workflows: ["CI CodeQuest"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Générer le CHANGELOG et le tag SemVer
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Calculer la prochaine version SemVer depuis les Conventional Commits
        id: changelog
        run: |
          VERSION=$(node scripts/release.cjs)
          if [ -n "$VERSION" ] && git rev-parse -q --verify "refs/tags/v$VERSION"; then
            VERSION=""
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publier le tag annoté sur le commit de main dont la CI est verte
        if: steps.changelog.outputs.version != ''
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          echo "Tag v$VERSION publié (SemVer, CI verte)."

      - name: Proposer le CHANGELOG généré via une PR (main protégée)
        if: steps.changelog.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          BRANCH="release/changelog-v$VERSION"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git push --force-with-lease origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): v$VERSION" \
            --body "CHANGELOG généré depuis les Conventional Commits par \`scripts/release.cjs\`. Le tag annoté \`v$VERSION\` pointe le commit de main dont la CI est verte." \
            || echo "Une PR de release existe déjà pour v$VERSION."
